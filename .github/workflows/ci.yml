   name: CI

   on:
     push:
       branches: [ '**' ]
     pull_request:
       branches: [ main ]

   jobs:
     build:
       runs-on: ubuntu-latest

       steps:
         - uses: actions/checkout@v4

         - name: Set up JDK 25
           uses: actions/setup-java@v4
           with:
             java-version: '25'
             distribution: 'oracle'

         - name: Build and test with Maven
           run: mvn verify
           working-directory: Gazillionair
